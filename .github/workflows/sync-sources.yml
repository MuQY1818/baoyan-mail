name: Sync DDL sources
run-name: DDL source sync (${{ inputs.sync_run_id || github.run_id }})

on:
  schedule:
    - cron: "17 0-15 * * *"
  workflow_dispatch:
    inputs:
      sync_run_id:
        description: "云端兜底关联运行 ID（留空自动生成）"
        required: false
        type: string

concurrency:
  group: sync-ddl-sources
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch, merge, and upload sources
        env:
          BAOYAN_ADMIN_TOKEN: ${{ secrets.BAOYAN_ADMIN_TOKEN }}
          BAOYAN_SYNC_BASE_URL: https://baoyan-mail.weijuebu.workers.dev
          BAOYAN_SYNC_RUN_ID: ${{ inputs.sync_run_id }}
        run: npm run sync:sources:external
